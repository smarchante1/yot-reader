<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ye Olde Treehouse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #E1F6FA;
      }
      .font-cinzel { font-family: 'Cinzel', serif; }
      
      /* Custom scrollbar to match the brand aesthetic */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #E1F6FA; 
      }
      ::-webkit-scrollbar-thumb {
        background: #016F93; 
        border-radius: 10px;
        border: 2px solid #E1F6FA;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1192A3; 
      }
      /* For Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #016F93 #E1F6FA;
      }

      @keyframes pulse-led {
        0%, 100% { 
          opacity: 1;
          box-shadow: 0 0 8px 2px rgba(225, 246, 250, 0.8);
        }
        50% { 
          opacity: 0.5;
          box-shadow: 0 0 2px 0px rgba(225, 246, 250, 0.4);
        }
      }
      .animate-led {
        animation: pulse-led 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse-slow {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .animate-pulse-slow {
        animation: pulse-slow 8s ease-in-out infinite;
      }
    </style>
